# Set True Color
set-option -sa terminal-overrides ",xterm*:Tc"

set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# Live Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Global Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# start tab index from 1 
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window Bindings
unbind %
unbind '"'
bind 'v' split-window -h -c "#{pane_current_path}"
bind 'h' split-window -v -c "#{pane_current_path}"

 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Kingdom Hearts: Dive to the Heart ---
set -g status-style "bg=#0a0e27,fg=#dfe6ff"
set -g pane-border-style "fg=#2a3155"
set -g pane-active-border-style "fg=#4d7cff"
set -g message-style "bg=#141a3a,fg=#35d0e0"
set -g message-command-style "bg=#141a3a,fg=#35d0e0"
set -g mode-style "bg=#24306a,fg=#dfe6ff"
set -g display-panes-active-colour "#35d0e0"
set -g display-panes-colour "#4d7cff"
setw -g clock-mode-colour "#35d0e0"

# Plugin Configurations
set -g @tmux-dotbar-right false
set -g @tmux-dotbar-bg "#0a0e27"
set -g @tmux-dotbar-fg "#5a6699"
set -g @tmux-dotbar-fg-current "#35d0e0"
set -g @tmux-dotbar-fg-prefix "#f2c14e"
set -g @tmux-dotbar-fg-session "#ff8fb2"
set -g @scroll-speed-num-lines-per-scroll 1
set -g @fzf-url-history-limit '1000'
# set -g @fzf-url-fzf-options '--tmux center,70%,50% \
#     --layout=reverse --multi --cycle --exit-0 --no-preview \
#     --bind=tab:down,shift-tab:up,space:toggle+down,ctrl-a:select-all'
# set -g @resurrect-save 'S'
# set -g @resurrect-restore 'R'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'

# set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

