# True color. Plain `-s`, not `-sa`: appending re-adds the entry on every
# config reload, growing the list without bound.
set -s terminal-overrides ",xterm*:Tc"

# Underline cursor. Needed here as well as in kitty.conf — this TERM's `Se`
# reset capability is "\E[2 q" (steady block), so tmux would otherwise stamp
# the cursor back to a block on reset.
set -g cursor-style underline

set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# Responsiveness
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Live Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Global Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# start tab index from 1 
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window Bindings
unbind %
unbind '"'
bind 'v' split-window -h -c "#{pane_current_path}"
bind 'h' split-window -v -c "#{pane_current_path}"

# Pane Navigation (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane Resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# How often the status bar re-runs its #() shell commands (git branch).
set -g status-interval 5

# Theme — owns the whole status bar. Swap with
# `set-theme <dive-to-the-heart|organization-xiii>`
source-file ~/.config/tmux/current-theme.conf

# Plugin Configurations
set -g @scroll-speed-num-lines-per-scroll 1
# Wheel sends up/down to alternate-screen apps without mouse support (less, so
# bat and man). Otherwise it opens copy mode on the pane behind them.
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'
set -g @fzf-url-history-limit '1000'
# set -g @fzf-url-fzf-options '--tmux center,70%,50% \
#     --layout=reverse --multi --cycle --exit-0 --no-preview \
#     --bind=tab:down,shift-tab:up,space:toggle+down,ctrl-a:select-all'
# default resurrect binds (prefix C-s / C-r) collide with our
# `bind C-s send-prefix` passthrough above — remap.
set -g @resurrect-save 'g'
set -g @resurrect-restore 'G'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

