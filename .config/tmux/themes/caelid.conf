# Elden Ring — Caelid
#
# palette
#   bg      #1a0c0a
#   surface #2a1310
#   line    #4a211b
#   dim     #96695d
#   fg      #f2d9c8
#   rust        #f0803c
#   rot bloom   #e0608a
#   ember       #f2b45a
#   scarlet     #ff4f3f
#   sick moss   #a8b04a
#   gravity     #a98add
#
# Flame edges instead of arrows — everything here is burning.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#4a211b"
set -g pane-active-border-style    "fg=#f0803c"
set -g message-style               "bg=#2a1310,fg=#f0803c"
set -g message-command-style       "bg=#2a1310,fg=#f0803c"
set -g mode-style                  "bg=#6b2a1e,fg=#f2d9c8"
set -g display-panes-active-colour "#f0803c"
set -g display-panes-colour        "#e0608a"
setw -g clock-mode-colour          "#f0803c"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a0c0a,fg=#96695d"
set -g status-left-length 60
set -g status-right-length 120

# session block: accent, turns warm while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#f2b45a],#[fg=#f0803c]}#[bg=#1a0c0a]#{?client_prefix,#[bg=#f2b45a],#[bg=#f0803c]}#[fg=#1a0c0a,bold] 󰈸 #S #{?client_prefix,#[fg=#f2b45a],#[fg=#f0803c]}#[bg=#1a0c0a,nobold]"

# windows: active is a block, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#96695d,bg=#1a0c0a]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#e0608a,bg=#1a0c0a]#[fg=#1a0c0a,bg=#e0608a,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#e0608a,bg=#1a0c0a,nobold]"
setw -g window-status-bell-style "fg=#ff4f3f,bg=#1a0c0a,bold"
setw -g window-status-activity-style "fg=#f2b45a,bg=#1a0c0a"

# right: git branch (surface block) then path (accent block)
set -g status-right "#[fg=#2a1310,bg=#1a0c0a]#[fg=#a8b04a,bg=#2a1310]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#2a1310,bg=#1a0c0a] #[fg=#f0803c]#[fg=#1a0c0a,bg=#f0803c,bold]  #{b:pane_current_path} #[fg=#f0803c,bg=#1a0c0a,nobold]"
