# Y2K Vaporwave
#
# palette
#   bg      #150a2e
#   surface #221244
#   line    #3b2670
#   dim     #8d7abc
#   fg      #f4ecff
#   hot pink    #ff4fd8
#   cyan        #38e8ff
#   sunset      #ffd166
#   neon red    #ff5c7a
#   mint        #5dfdbb
#   ultraviolet #a77bff
#
# Slanted blocks — the Y2K italic-chrome read.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#3b2670"
set -g pane-active-border-style    "fg=#ff4fd8"
set -g message-style               "bg=#221244,fg=#ff4fd8"
set -g message-command-style       "bg=#221244,fg=#ff4fd8"
set -g mode-style                  "bg=#57309c,fg=#f4ecff"
set -g display-panes-active-colour "#ff4fd8"
set -g display-panes-colour        "#38e8ff"
setw -g clock-mode-colour          "#ff4fd8"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#150a2e,fg=#8d7abc"
set -g status-left-length 60
set -g status-right-length 120

# session block: accent, turns warm while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#ffd166],#[fg=#ff4fd8]}#[bg=#150a2e]#{?client_prefix,#[bg=#ffd166],#[bg=#ff4fd8]}#[fg=#150a2e,bold] 󰓎 #S #{?client_prefix,#[fg=#ffd166],#[fg=#ff4fd8]}#[bg=#150a2e,nobold]"

# windows: active is a block, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8d7abc,bg=#150a2e]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#38e8ff,bg=#150a2e]#[fg=#150a2e,bg=#38e8ff,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#38e8ff,bg=#150a2e,nobold]"
setw -g window-status-bell-style "fg=#ff5c7a,bg=#150a2e,bold"
setw -g window-status-activity-style "fg=#ffd166,bg=#150a2e"

# right: git branch (surface block) then path (accent block)
set -g status-right "#[fg=#221244,bg=#150a2e]#[fg=#5dfdbb,bg=#221244]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#221244,bg=#150a2e] #[fg=#ff4fd8]#[fg=#150a2e,bg=#ff4fd8,bold]  #{b:pane_current_path} #[fg=#ff4fd8,bg=#150a2e,nobold]"
