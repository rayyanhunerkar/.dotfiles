# Greenpath
#
# palette
#   bg      #0b1410
#   surface #121f18
#   line    #26392d
#   dim     #6a8574
#   fg      #e3efe2
#   leaf        #8fcf6e
#   unn         #5fa8c4
#   pollen      #e0b64f
#   hornet      #d9625a
#   moss        #57c7a0
#   petal       #b08fc7
#
# Leaf marks the session; no blocks, just growth on dark.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#26392d"
set -g pane-active-border-style    "fg=#8fcf6e"
set -g message-style               "bg=#121f18,fg=#8fcf6e"
set -g message-command-style       "bg=#121f18,fg=#8fcf6e"
set -g mode-style                  "bg=#2f4d2f,fg=#e3efe2"
set -g display-panes-active-colour "#8fcf6e"
set -g display-panes-colour        "#5fa8c4"
setw -g clock-mode-colour          "#8fcf6e"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0b1410,fg=#6a8574"
set -g status-left-length 60
set -g status-right-length 120

# session: leaf mark, turns pollen while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#e0b64f],#[fg=#8fcf6e]}#[bg=#0b1410,bold]  #[fg=#e3efe2]#S #[fg=#6a8574,nobold] "

# windows: active is leaf text, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6a8574,bg=#0b1410]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#8fcf6e,bg=#0b1410,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[nobold]"
setw -g window-status-bell-style "fg=#d9625a,bg=#0b1410,bold"
setw -g window-status-activity-style "fg=#e0b64f,bg=#0b1410"

# right: git branch then path, dim and quiet
set -g status-right "#[fg=#6a8574,bg=#0b1410]#(~/.config/tmux/scripts/git-branch.sh) · #[fg=#e3efe2]#{b:pane_current_path} "
