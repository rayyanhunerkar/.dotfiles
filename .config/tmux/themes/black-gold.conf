# Black Gold
#
# palette
#   bg      #000000
#   surface #0f0d08
#   line    #332a14
#   dim     #8a7a52
#   fg      #f5ecd6
#   gold        #d4af37
#   gilt        #f5d76e
#   amber       #ff9f1c
#   garnet      #e5484d
#   laurel      #a3b86c
#   rose-gold   #dba392
#
# One gold plaque for the session; everything else is text on black.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#332a14"
set -g pane-active-border-style    "fg=#d4af37"
set -g message-style               "bg=#0f0d08,fg=#d4af37"
set -g message-command-style       "bg=#0f0d08,fg=#d4af37"
set -g mode-style                  "bg=#5a4c2c,fg=#f5ecd6"
set -g display-panes-active-colour "#d4af37"
set -g display-panes-colour        "#f5d76e"
setw -g clock-mode-colour          "#d4af37"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#8a7a52"
set -g status-left-length 60
set -g status-right-length 120

# session: gold plaque, turns amber while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#ff9f1c],#[bg=#d4af37]}#[fg=#000000,bold] #S #[bg=#000000,fg=#8a7a52,nobold] "

# windows: active is gold text, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8a7a52,bg=#000000]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#d4af37,bg=#000000,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[nobold]"
setw -g window-status-bell-style "fg=#e5484d,bg=#000000,bold"
setw -g window-status-activity-style "fg=#ff9f1c,bg=#000000"

# right: git branch then path, dim and quiet
set -g status-right "#[fg=#8a7a52,bg=#000000]#(~/.config/tmux/scripts/git-branch.sh) · #[fg=#f5ecd6]#{b:pane_current_path} "
