# Destiny Islands
#
# palette
#   bg      #0a2b2e
#   surface #113a3c
#   line    #205355
#   dim     #6f9c97
#   fg      #fbeed6
#   sea         #39c5bb
#   sky         #6ec6ff
#   paopu       #ffc93c
#   coral       #ff7f6a
#   palm        #7fd46a
#   shell       #f6a6c1
#
# Square blocks with no caps, joined by a tide mark.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#205355"
set -g pane-active-border-style    "fg=#39c5bb"
set -g message-style               "bg=#113a3c,fg=#39c5bb"
set -g message-command-style       "bg=#113a3c,fg=#39c5bb"
set -g mode-style                  "bg=#1d6a68,fg=#fbeed6"
set -g display-panes-active-colour "#39c5bb"
set -g display-panes-colour        "#6ec6ff"
setw -g clock-mode-colour          "#39c5bb"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0a2b2e,fg=#6f9c97"
set -g status-left-length 60
set -g status-right-length 120

# session: paopu block, turns coral while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#ff7f6a],#[bg=#ffc93c]}#[fg=#0a2b2e,bold] 󰖙 #S #[bg=#0a2b2e,nobold]"

# windows: active is a sea block, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6f9c97,bg=#0a2b2e]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#0a2b2e,bg=#39c5bb,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#39c5bb,bg=#0a2b2e,nobold]"
setw -g window-status-bell-style "fg=#ff7f6a,bg=#0a2b2e,bold"
setw -g window-status-activity-style "fg=#ffc93c,bg=#0a2b2e"

# right: git branch, a tide mark, then path (sea block)
set -g status-right "#[fg=#7fd46a,bg=#0a2b2e]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#6f9c97]≈ #[fg=#0a2b2e,bg=#39c5bb,bold]  #{b:pane_current_path} "
