# Kingdom Hearts — Twilight Town
#
# palette
#   bg      #1a1220   dusk ground
#   surface #241a2e   raised block
#   line    #3a2c47   inactive border
#   dim     #7d6b8f   muted text
#   fg      #ffe4c4   warm cream
#   orange  #ff9e4f   sunset
#   amber   #ffc857   clock tower gold
#   teal    #4fd6be   sea-salt ice cream
#   purple  #c98fd8   dusk
#   red     #ff7a7a

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#3a2c47"
set -g pane-active-border-style    "fg=#ff9e4f"
set -g message-style               "bg=#241a2e,fg=#4fd6be"
set -g message-command-style       "bg=#241a2e,fg=#4fd6be"
set -g mode-style                  "bg=#4a3358,fg=#ffe4c4"
set -g display-panes-active-colour "#4fd6be"
set -g display-panes-colour        "#ff9e4f"
setw -g clock-mode-colour          "#ff9e4f"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1220,fg=#7d6b8f"
set -g status-left-length 60
set -g status-right-length 120

# session block: sunset orange, turns dusk purple while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#c98fd8],#[bg=#ff9e4f]}#[fg=#1a1220,bold] 󰄖 #S #{?client_prefix,#[fg=#c98fd8],#[fg=#ff9e4f]}#[bg=#1a1220,nobold]"

# windows: active is a sea-salt block, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#7d6b8f,bg=#1a1220]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#1a1220,bg=#4fd6be]#[fg=#1a1220,bg=#4fd6be,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#4fd6be,bg=#1a1220,nobold]"
setw -g window-status-bell-style "fg=#ff7a7a,bg=#1a1220,bold"
setw -g window-status-activity-style "fg=#ffc857,bg=#1a1220"

# right: git branch (sea-salt) then path (amber)
set -g status-right "#[fg=#3a2c47]#[fg=#4fd6be,bg=#3a2c47]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#ffc857,bg=#3a2c47]#[fg=#1a1220,bg=#ffc857,bold]  #{b:pane_current_path} "
