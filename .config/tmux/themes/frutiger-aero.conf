# Frutiger Aero
#
# palette
#   bg      #04222e   deep water
#   surface #0a3242   glass block
#   line    #174c60   inactive border
#   dim     #5f96aa   muted text
#   fg      #e6f7ff   gloss white
#   aqua    #2ee6d6   signature cyan
#   sky     #4db8ff
#   lime    #8ee84f   eco green
#   sun     #ffd93d
#   coral   #ff6b6b
#
# Rounded caps instead of powerline arrows — the glossy bubble read.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#174c60"
set -g pane-active-border-style    "fg=#2ee6d6"
set -g message-style               "bg=#0a3242,fg=#2ee6d6"
set -g message-command-style       "bg=#0a3242,fg=#2ee6d6"
set -g mode-style                  "bg=#16607a,fg=#e6f7ff"
set -g display-panes-active-colour "#2ee6d6"
set -g display-panes-colour        "#4db8ff"
setw -g clock-mode-colour          "#2ee6d6"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#04222e,fg=#5f96aa"
set -g status-left-length 60
set -g status-right-length 120

# session capsule: aqua, turns sunlight yellow while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#ffd93d],#[fg=#2ee6d6]}#[bg=#04222e]#{?client_prefix,#[bg=#ffd93d],#[bg=#2ee6d6]}#[fg=#04222e,bold] 󰠓 #S #{?client_prefix,#[fg=#ffd93d],#[fg=#2ee6d6]}#[bg=#04222e,nobold] "

# windows: active is a sky capsule, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#5f96aa,bg=#04222e]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#4db8ff,bg=#04222e]#[fg=#04222e,bg=#4db8ff,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#4db8ff,bg=#04222e,nobold]"
setw -g window-status-bell-style "fg=#ff6b6b,bg=#04222e,bold"
setw -g window-status-activity-style "fg=#ffd93d,bg=#04222e"

# right: git branch (lime capsule) then path (aqua capsule)
set -g status-right "#[fg=#0a3242]#[fg=#8ee84f,bg=#0a3242]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#0a3242,bg=#04222e] #[fg=#2ee6d6]#[fg=#04222e,bg=#2ee6d6,bold]  #{b:pane_current_path} #[fg=#2ee6d6,bg=#04222e,nobold]"
