# Elden Ring — Erdtree
#
# palette
#   bg      #14100c   ash / soot ground
#   surface #1f1a13   raised block
#   line    #3a3227   inactive border
#   dim     #7a6b52   muted text
#   fg      #e8dcc0   bone / parchment
#   gold    #d4a437   Erdtree
#   amber   #e8c56a   site of grace
#   blood   #b83232
#   glint   #5aa8b8   glintstone
#   moss    #7a8a52   verdant

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#3a3227"
set -g pane-active-border-style    "fg=#d4a437"
set -g message-style               "bg=#1f1a13,fg=#e8c56a"
set -g message-command-style       "bg=#1f1a13,fg=#e8c56a"
set -g mode-style                  "bg=#4a3a20,fg=#e8dcc0"
set -g display-panes-active-colour "#e8c56a"
set -g display-panes-colour        "#d4a437"
setw -g clock-mode-colour          "#d4a437"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#14100c,fg=#7a6b52"
set -g status-left-length 60
set -g status-right-length 120

# session block: Erdtree gold, turns blood red while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#b83232],#[bg=#d4a437]}#[fg=#14100c,bold] 󰄖 #S #{?client_prefix,#[fg=#b83232],#[fg=#d4a437]}#[bg=#14100c,nobold]"

# windows: active is a grace-amber block, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#7a6b52,bg=#14100c]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#14100c,bg=#e8c56a]#[fg=#14100c,bg=#e8c56a,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#e8c56a,bg=#14100c,nobold]"
setw -g window-status-bell-style "fg=#b83232,bg=#14100c,bold"
setw -g window-status-activity-style "fg=#d4a437,bg=#14100c"

# right: git branch (glintstone) then path (Erdtree gold)
set -g status-right "#[fg=#3a3227]#[fg=#5aa8b8,bg=#3a3227]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#d4a437,bg=#3a3227]#[fg=#14100c,bg=#d4a437,bold]  #{b:pane_current_path} "
