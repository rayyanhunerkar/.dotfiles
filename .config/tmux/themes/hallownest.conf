# Hallownest
#
# palette
#   bg      #0c0e14
#   surface #151924
#   line    #2a3040
#   dim     #6d7890
#   fg      #e9edf2
#   tears       #6fa3d8
#   lumafly     #8fe3dc
#   infection   #f08a3c
#   grimm       #d8524f
#   greenpath   #7fb88a
#   dream       #a48fd0
#
# No blocks at all — text on the void.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#2a3040"
set -g pane-active-border-style    "fg=#6fa3d8"
set -g message-style               "bg=#151924,fg=#6fa3d8"
set -g message-command-style       "bg=#151924,fg=#6fa3d8"
set -g mode-style                  "bg=#2d4a6e,fg=#e9edf2"
set -g display-panes-active-colour "#6fa3d8"
set -g display-panes-colour        "#8fe3dc"
setw -g clock-mode-colour          "#6fa3d8"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0c0e14,fg=#6d7890"
set -g status-left-length 60
set -g status-right-length 120

# session: pale soul text, turns infected while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#f08a3c],#[fg=#e9edf2]}#[bg=#0c0e14,bold] ◆ #S #[fg=#6d7890,nobold] "

# windows: active is tears-blue text, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6d7890,bg=#0c0e14]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#6fa3d8,bg=#0c0e14,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[nobold]"
setw -g window-status-bell-style "fg=#d8524f,bg=#0c0e14,bold"
setw -g window-status-activity-style "fg=#f08a3c,bg=#0c0e14"

# right: git branch then path, dim and quiet
set -g status-right "#[fg=#6d7890,bg=#0c0e14]#(~/.config/tmux/scripts/git-branch.sh) · #[fg=#e9edf2]#{b:pane_current_path} "
