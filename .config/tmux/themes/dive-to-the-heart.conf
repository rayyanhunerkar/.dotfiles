# Kingdom Hearts — Dive to the Heart
set -g status-style "bg=#0a0e27,fg=#dfe6ff"
set -g pane-border-style "fg=#2a3155"
set -g pane-active-border-style "fg=#4d7cff"
set -g message-style "bg=#141a3a,fg=#35d0e0"
set -g message-command-style "bg=#141a3a,fg=#35d0e0"
set -g mode-style "bg=#24306a,fg=#dfe6ff"
set -g display-panes-active-colour "#35d0e0"
set -g display-panes-colour "#4d7cff"
setw -g clock-mode-colour "#35d0e0"

set -g @tmux-dotbar-bg "#0a0e27"
set -g @tmux-dotbar-fg "#5a6699"
set -g @tmux-dotbar-fg-current "#35d0e0"
set -g @tmux-dotbar-fg-prefix "#f2c14e"
set -g @tmux-dotbar-fg-session "#ff8fb2"
