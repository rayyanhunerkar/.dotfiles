# Kingdom Hearts — Dive to the Heart
#
# palette
#   bg      #0a0e27   station midnight
#   surface #141a3a   raised block
#   line    #2a3155   inactive border
#   dim     #5a6699   muted text
#   fg      #dfe6ff   text
#   blue    #4d7cff   keyblade
#   cyan    #35d0e0   dive glow
#   gold    #f2c14e   crown
#   pink    #ff8fb2   paopu
#   red     #e0566b   heartless

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#2a3155"
set -g pane-active-border-style    "fg=#4d7cff"
set -g message-style               "bg=#141a3a,fg=#35d0e0"
set -g message-command-style       "bg=#141a3a,fg=#35d0e0"
set -g mode-style                  "bg=#24306a,fg=#dfe6ff"
set -g display-panes-active-colour "#35d0e0"
set -g display-panes-colour        "#4d7cff"
setw -g clock-mode-colour          "#35d0e0"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0a0e27,fg=#5a6699"
set -g status-left-length 60
set -g status-right-length 120

# session block: gold, turns paopu-pink while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#ff8fb2],#[bg=#f2c14e]}#[fg=#0a0e27,bold] 󰄖 #S #{?client_prefix,#[fg=#ff8fb2],#[fg=#f2c14e]}#[bg=#0a0e27,nobold]"

# windows: active is a cyan block, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#5a6699,bg=#0a0e27]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#0a0e27,bg=#35d0e0]#[fg=#0a0e27,bg=#35d0e0,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#35d0e0,bg=#0a0e27,nobold]"
setw -g window-status-bell-style "fg=#e0566b,bg=#0a0e27,bold"
setw -g window-status-activity-style "fg=#f2c14e,bg=#0a0e27"

# right: git branch (cyan) then path (blue)
set -g status-right "#[fg=#2a3155]#[fg=#35d0e0,bg=#2a3155]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#4d7cff,bg=#2a3155]#[fg=#0a0e27,bg=#4d7cff,bold]  #{b:pane_current_path} "
