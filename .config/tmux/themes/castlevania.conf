# Castlevania
#
# palette
#   bg      #120a10
#   surface #1e1119
#   line    #3e2230
#   dim     #8f7482
#   fg      #efe3da
#   blood       #e8455a
#   moon        #7fa6d6
#   candle      #eeb04a
#   ember       #ff7a66
#   herb        #7fb08a
#   soul        #a77fd1
#
# A cross for the session; stone and candlelight, no blocks.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#3e2230"
set -g pane-active-border-style    "fg=#e8455a"
set -g message-style               "bg=#1e1119,fg=#e8455a"
set -g message-command-style       "bg=#1e1119,fg=#e8455a"
set -g mode-style                  "bg=#5a1f2e,fg=#efe3da"
set -g display-panes-active-colour "#e8455a"
set -g display-panes-colour        "#7fa6d6"
setw -g clock-mode-colour          "#e8455a"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#120a10,fg=#8f7482"
set -g status-left-length 60
set -g status-right-length 120

# session: blood mark, turns candle while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#eeb04a],#[fg=#e8455a]}#[bg=#120a10,bold] † #[fg=#efe3da]#S #[fg=#8f7482,nobold] "

# windows: active is blood text, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8f7482,bg=#120a10]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#e8455a,bg=#120a10,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[nobold]"
setw -g window-status-bell-style "fg=#ff7a66,bg=#120a10,bold"
setw -g window-status-activity-style "fg=#eeb04a,bg=#120a10"

# right: git branch then path, dim and quiet
set -g status-right "#[fg=#8f7482,bg=#120a10]#(~/.config/tmux/scripts/git-branch.sh) · #[fg=#efe3da]#{b:pane_current_path} "
