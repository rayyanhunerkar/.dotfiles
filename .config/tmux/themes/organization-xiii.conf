# Kingdom Hearts — Organization XIII
set -g status-style "bg=#0b0b0d,fg=#e8e8ec"
set -g pane-border-style "fg=#2a2a30"
set -g pane-active-border-style "fg=#2e5c8a"
set -g message-style "bg=#1c1c20,fg=#7fb0c9"
set -g message-command-style "bg=#1c1c20,fg=#7fb0c9"
set -g mode-style "bg=#2e5c8a,fg=#e8e8ec"
set -g display-panes-active-colour "#7fb0c9"
set -g display-panes-colour "#2e5c8a"
setw -g clock-mode-colour "#7fb0c9"

set -g @tmux-dotbar-bg "#0b0b0d"
set -g @tmux-dotbar-fg "#6a6a75"
set -g @tmux-dotbar-fg-current "#7fb0c9"
set -g @tmux-dotbar-fg-prefix "#c8102e"
set -g @tmux-dotbar-fg-session "#b8bcc4"
