# Kingdom Hearts — Organization XIII
#
# palette
#   bg      #0b0b0d   void black
#   surface #1c1c20   raised block
#   line    #2a2a30   inactive border
#   grey    #6a6a75   dusk / muted text
#   fg      #e8e8ec   nobody white
#   blue    #2e5c8a   cold moon
#   cyan    #7fb0c9   kingdom hearts glow
#   red     #c8102e   crimson
#   silver  #b8bcc4   nobody silver

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#2a2a30"
set -g pane-active-border-style    "fg=#2e5c8a"
set -g message-style               "bg=#1c1c20,fg=#7fb0c9"
set -g message-command-style       "bg=#1c1c20,fg=#7fb0c9"
set -g mode-style                  "bg=#2e5c8a,fg=#e8e8ec"
set -g display-panes-active-colour "#7fb0c9"
set -g display-panes-colour        "#2e5c8a"
setw -g clock-mode-colour          "#7fb0c9"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0b0b0d,fg=#6a6a75"
set -g status-left-length 60
set -g status-right-length 120

# session block: silver, turns crimson while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#c8102e],#[bg=#b8bcc4]}#[fg=#0b0b0d,bold] 󰄖 #S #{?client_prefix,#[fg=#c8102e],#[fg=#b8bcc4]}#[bg=#0b0b0d,nobold]"

# windows: active is a moon-glow block, inactive is flat dusk text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6a6a75,bg=#0b0b0d]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#0b0b0d,bg=#7fb0c9]#[fg=#0b0b0d,bg=#7fb0c9,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#7fb0c9,bg=#0b0b0d,nobold]"
setw -g window-status-bell-style "fg=#c8102e,bg=#0b0b0d,bold"
setw -g window-status-activity-style "fg=#b8bcc4,bg=#0b0b0d"

# right: git branch (moon glow) then path (cold moon)
set -g status-right "#[fg=#2a2a30]#[fg=#7fb0c9,bg=#2a2a30]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#2e5c8a,bg=#2a2a30]#[fg=#0b0b0d,bg=#2e5c8a,bold]  #{b:pane_current_path} "
