# Crystal Peak
#
# palette
#   bg      #15111c
#   surface #1f1829
#   line    #3a2d4a
#   dim     #85759a
#   fg      #f3e8f2
#   crystal     #f27fc0
#   ice         #84dcdc
#   lantern     #f2c078
#   husk        #e8566f
#   lichen      #7fd4b0
#   quartz      #8fb4f0
#
# Facets, not blocks — a hollow diamond for the session.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#3a2d4a"
set -g pane-active-border-style    "fg=#f27fc0"
set -g message-style               "bg=#1f1829,fg=#f27fc0"
set -g message-command-style       "bg=#1f1829,fg=#f27fc0"
set -g mode-style                  "bg=#5b3358,fg=#f3e8f2"
set -g display-panes-active-colour "#f27fc0"
set -g display-panes-colour        "#84dcdc"
setw -g clock-mode-colour          "#f27fc0"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#15111c,fg=#85759a"
set -g status-left-length 60
set -g status-right-length 120

# session: crystal mark, turns lantern while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#f2c078],#[fg=#f27fc0]}#[bg=#15111c,bold] ◇ #[fg=#f3e8f2]#S #[fg=#85759a,nobold] "

# windows: active is crystal text, inactive is flat dim text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#85759a,bg=#15111c]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#f27fc0,bg=#15111c,bold] ◆ #I #W#{?window_zoomed_flag, 󰊓,} #[nobold]"
setw -g window-status-bell-style "fg=#e8566f,bg=#15111c,bold"
setw -g window-status-activity-style "fg=#f2c078,bg=#15111c"

# right: git branch then path, dim and quiet
set -g status-right "#[fg=#85759a,bg=#15111c]#(~/.config/tmux/scripts/git-branch.sh) · #[fg=#f3e8f2]#{b:pane_current_path} "
