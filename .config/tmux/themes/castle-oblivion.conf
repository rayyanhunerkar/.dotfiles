# Kingdom Hearts — Castle Oblivion (clear glass)
#
# palette
#   bg      #2b2b33   pale smoke — mostly wallpaper at 0.25 opacity
#   surface #3a3a44   raised block
#   line    #4a4a56   inactive border
#   dim     #9a9284   muted text
#   fg      #f0ede4   chalk
#   rose    #e89aa2   Marluxia
#   gold    #d9b76a
#   sage    #8fb89e
#   slate   #a8bcd4
#
# The bar keeps a solid `surface` ground rather than the transparent one, so it
# stays a readable anchor at the bottom of an otherwise see-through window.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#4a4a56"
set -g pane-active-border-style    "fg=#e89aa2"
set -g message-style               "bg=#3a3a44,fg=#a8bcd4"
set -g message-command-style       "bg=#3a3a44,fg=#a8bcd4"
set -g mode-style                  "bg=#5a5a6a,fg=#f0ede4"
set -g display-panes-active-colour "#e89aa2"
set -g display-panes-colour        "#a8bcd4"
setw -g clock-mode-colour          "#a8bcd4"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#3a3a44,fg=#9a9284"
set -g status-left-length 60
set -g status-right-length 120

# session block: slate, turns rose while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#e89aa2],#[bg=#a8bcd4]}#[fg=#2b2b33,bold] 󰄖 #S #{?client_prefix,#[fg=#e89aa2],#[fg=#a8bcd4]}#[bg=#3a3a44,nobold]"

# windows: active is a rose block, inactive is flat muted text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#9a9284,bg=#3a3a44]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#3a3a44,bg=#e89aa2]#[fg=#2b2b33,bg=#e89aa2,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#e89aa2,bg=#3a3a44,nobold]"
setw -g window-status-bell-style "fg=#f0787e,bg=#3a3a44,bold"
setw -g window-status-activity-style "fg=#d9b76a,bg=#3a3a44"

# right: git branch (sage) then path (slate)
set -g status-right "#[fg=#4a4a56]#[fg=#8fb89e,bg=#4a4a56]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#a8bcd4,bg=#4a4a56]#[fg=#2b2b33,bg=#a8bcd4,bold]  #{b:pane_current_path} "
