# Kingdom Hearts — Castle Oblivion (light)
#
# palette
#   bg      #f4f1ea   parchment ground
#   surface #e8e3d8   raised block
#   line    #d4cdbf   inactive border
#   dim     #8a8272   muted text
#   fg      #2a2a33   ink
#   slate   #5a6478
#   rose    #c96a72   Marluxia
#   gold    #b8952f
#   sage    #6f8f7a
#
# Blocks use dark fills with parchment text — inverted from the dark themes,
# since a bright fill on a light bar would have no contrast.

# --- panes / messages / modes ---
set -g pane-border-style           "fg=#d4cdbf"
set -g pane-active-border-style    "fg=#c96a72"
set -g message-style               "bg=#e8e3d8,fg=#46586f"
set -g message-command-style       "bg=#e8e3d8,fg=#46586f"
set -g mode-style                  "bg=#5a6478,fg=#f4f1ea"
set -g display-panes-active-colour "#c96a72"
set -g display-panes-colour        "#5a6478"
setw -g clock-mode-colour          "#5a6478"

# --- status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#e8e3d8,fg=#8a8272"
set -g status-left-length 60
set -g status-right-length 120

# session block: slate, turns rose while the prefix is held
set -g status-left "#{?client_prefix,#[bg=#c96a72],#[bg=#5a6478]}#[fg=#f4f1ea,bold] 󰄖 #S #{?client_prefix,#[fg=#c96a72],#[fg=#5a6478]}#[bg=#e8e3d8,nobold]"

# windows: active is a rose block, inactive is flat muted text
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8a8272,bg=#e8e3d8]  #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#e8e3d8,bg=#c96a72]#[fg=#f4f1ea,bg=#c96a72,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#c96a72,bg=#e8e3d8,nobold]"
setw -g window-status-bell-style "fg=#b5474d,bg=#e8e3d8,bold"
setw -g window-status-activity-style "fg=#9a7a1f,bg=#e8e3d8"

# right: git branch (sage) then path (slate)
set -g status-right "#[fg=#d4cdbf]#[fg=#5c7a66,bg=#d4cdbf]#(~/.config/tmux/scripts/git-branch.sh) #[fg=#5a6478,bg=#d4cdbf]#[fg=#f4f1ea,bg=#5a6478,bold]  #{b:pane_current_path} "
