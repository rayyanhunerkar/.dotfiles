include ./kingdom-hearts.conf

background            #0a0e27
background_opacity    0.75
background_blur       30

# --- Window Layout ---
remember_window_size  no
initial_window_width  132c
initial_window_height 40c
window_padding_width  20
hide_window_decorations no

# --- Font Configuration ---
font_family      JetBrainsMono Nerd Font Regular
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        15.0

# Kitty handles "offset" via line_height
modify_font line_height 110%

# --- Cursor ---
cursor_shape          underline
cursor_blink_interval 0
shell_integration     no-cursor

# --- Mouse / Selection ---
copy_on_select        yes

# --- Shell ---
# Note: Kitty usually detects shells automatically, but to force tmux:
shell /bin/zsh --login -c "/opt/homebrew/bin/tmux attach || /opt/homebrew/bin/tmux"

# --- Keyboard Shortcuts ---
# Standard macOS word navigation
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf

# Cmd + Backspace to delete line
map cmd+backspace send_text all \x15

# Font Resizing
map cmd+plus            change_font_size all +2.0
map cmd+minus           change_font_size all -2.0
map cmd+0               change_font_size all 0

watcher_enabled yes
