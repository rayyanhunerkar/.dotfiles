# swap with `scripts/set-theme.sh <dive-to-the-heart|organization-xiii>`
include ./current-theme.conf

# background_opacity / background_blur are set per-theme in themes/*.conf —
# a light theme needs far less transparency than a dark one to stay readable.

# --- Window Layout ---
remember_window_size  no
initial_window_width  132c
initial_window_height 40c
window_padding_width  20
hide_window_decorations no

# macOS native fullscreen moves the window into its own Space, where it is
# composited against black — nothing sits behind it, so transparency and blur
# read as solid. Traditional fullscreen just resizes in place and keeps them.
macos_traditional_fullscreen yes

# --- Font Configuration ---
# swap with `scripts/set-font.sh <jetbrains-mono|victor-mono|maple-mono>`
include ./current-font.conf
font_size        15.0

# Kitty handles "offset" via line_height
modify_font line_height 110%

# --- Cursor ---
cursor_shape          underline
cursor_blink_interval 0
shell_integration     no-cursor

# --- Mouse / Selection ---
copy_on_select        yes

# --- Shell ---
# Note: Kitty usually detects shells automatically, but to force tmux:
shell /bin/zsh --login -c "/opt/homebrew/bin/tmux attach || /opt/homebrew/bin/tmux"

# --- Keyboard Shortcuts ---
# Standard macOS word navigation
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf

# Cmd + Backspace to delete line
map cmd+backspace send_text all \x15

# Font Resizing
map cmd+plus            change_font_size all +2.0
map cmd+minus           change_font_size all -2.0
map cmd+0               change_font_size all 0

watcher_enabled yes

# Remote control (local socket only) — lets set-font.sh live-swap fonts
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
