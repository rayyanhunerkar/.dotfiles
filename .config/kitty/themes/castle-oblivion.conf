# Kingdom Hearts — Castle Oblivion
# Clear glass. The most transparent theme: at this opacity the ground is mostly
# wallpaper, so the palette is lit for a DARK ground — chalk text, softened
# Marluxia rose, muted memory-card pastels.

foreground            #f0ede4
background            #2b2b33
background_opacity    0.25
background_blur       60
selection_foreground  #2b2b33
selection_background  #a8bcd4

cursor                #e89aa2
cursor_text_color     #2b2b33

url_color             #e8c87a

# window borders
active_border_color   #e89aa2
inactive_border_color #4a4a56
bell_border_color     #f0787e

# tab bar
active_tab_foreground   #2b2b33
active_tab_background   #e89aa2
inactive_tab_foreground #9a9284
inactive_tab_background #3a3a44

# --- 16 colors ---
# All lit well above the tint so they survive the wallpaper showing through.
# black (smoke)
color0  #3a3a44
color8  #4a4a56
# red (Marluxia rose)
color1  #e07a80
color9  #f09aa0
# green (sage)
color2  #8fb89e
color10 #a8ccb4
# yellow (pale gold)
color3  #d9b76a
color11 #e8cd8a
# blue (slate)
color4  #8fa8c4
color12 #a8c0d8
# magenta
color5  #c49ab4
color13 #d8b4c8
# cyan
color6  #7fb4b4
color14 #9acccc
# white (chalk)
color7  #c4beb2
